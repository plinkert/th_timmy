name: "Data Encrypted for Impact"
description: "Detect ransomware - mass file encryption, vssadmin delete, bcdedit"
version: "1.0"
mitre_technique_id: "T1486"
mitre_technique_name: "Data Encrypted for Impact"

technique_description: |
  Adversaries encrypt data to disrupt availability (ransomware). Common indicators: mass file
  extension changes, vssadmin delete shadows, bcdedit to disable recovery, wbadmin exclusion,
  deletion of shadow copies. Typical patterns: rapid sequential file modifications, processes
  modifying many files with new extensions (.encrypted, .locked), shadow copy deletion.

data_sources:
  - tool: "elk"
    mode: "manual"
    query_path: "queries/elk_manual.sql"
  - tool: "elk"
    mode: "API"
    query_path: "queries/elk_api.json"
  - tool: "ms_defender"
    mode: "manual"
    query_path: "queries/ms_defender_manual.kql"
  - tool: "ms_defender"
    mode: "API"
    query_path: "queries/ms_defender_api.json"
