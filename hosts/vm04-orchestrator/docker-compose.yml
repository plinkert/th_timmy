services:
  n8n:
    image: n8nio/n8n:latest
    container_name: threat-hunting-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      # Python task runner external mode configuration
      - EXECUTIONS_PROCESS=main
      - N8N_PYTHON_ENABLED=true
      - N8N_PYTHON_COMMAND=python3
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - threat-hunting-net

  prometheus:
    image: prom/prometheus:latest
    container_name: threat-hunting-prometheus
    restart: unless-stopped
    network_mode: host
    # Uses host network to scrape localhost:9091 (Python exporter)
    # Grafana connects via host.docker.internal:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  hunt_api:
    image: python:3.10-slim
    container_name: threat-hunting-hunt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ../../:/app
    environment:
      - PYTHONPATH=/app
      - PROJECT_ROOT=/app
    command: >
      sh -c "pip install -q fastapi uvicorn pyyaml pydantic &&
      uvicorn automation_scripts.playbooks.hunt_api:app --host 0.0.0.0 --port 8000"
    networks:
      - threat-hunting-net

  grafana:
    image: grafana/grafana:latest
    container_name: threat-hunting-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - threat-hunting-net
    depends_on:
      - prometheus

networks:
  threat-hunting-net:
    driver: bridge

volumes:
  n8n_data:
  grafana_data:
  prometheus_data:

